name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxcb-cursor0
      - name: Fetch verified static Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/fetch_windows_ffmpeg.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\build\ffmpeg-win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check public files for private data
        run: python tools/check_public.py
      - name: Test desktop editing, rendering and playback
        run: python -m unittest discover -s tests -v
      - name: Build executable and archive
        run: python tools/build.py
      - name: Smoke test Linux executable from another directory
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/nightfall/nightfall" --smoke-test
      - name: Smoke test Windows executable from another directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testFolder = Join-Path $env:RUNNER_TEMP 'Nightfall standalone test'
          Expand-Archive "$env:GITHUB_WORKSPACE/dist/nightfall-windows.zip" $testFolder
          Set-Location $env:RUNNER_TEMP
          $env:PATH = ''
          & "$testFolder/nightfall/nightfall.exe" --smoke-test --require-bundled-media
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: nightfall-${{ runner.os }}
          path: |
            dist/nightfall-linux.tar.gz
            dist/nightfall-windows.zip
          if-no-files-found: error
